pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    # Traefik sanitizes forwarded headers. This is the existing proxy bridge.
    set_real_ip_from 172.18.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_status 429;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    upstream crm_backend {
        zone crm_backend 64k;
        server crm:3000 resolve;
        keepalive 16;
    }
    server {
        listen 8080 default_server;
        server_name _;
        location = /healthz { access_log off; return 200 'ok\n'; }
        location / { return 444; }
    }
    server {
        listen 8080;
        server_name crm.hotelexpert.mx;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-SHE-Client-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        location ~ /\. { return 404; }
        location = /api/sara/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://crm_backend;
        }
        location = /api/crm/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://crm_backend;
        }
        location / { proxy_pass http://crm_backend; }
    }
}
