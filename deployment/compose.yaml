services:
  crm:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: she-crm:${CRM_RELEASE:-latest}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      VITE_BACKEND: n8n
      SARA_PUBLIC_ORIGIN: https://crm.hotelexpert.mx
      SARA_PROXY_SECRET: ${SARA_PROXY_SECRET:?Configure SARA_PROXY_SECRET}
      CRM_LOGIN_USER: ${CRM_LOGIN_USER:-direccion}
      CRM_LOGIN_PASSWORD_HASH: ${CRM_LOGIN_PASSWORD_HASH:?Configure CRM_LOGIN_PASSWORD_HASH}
      APP_ORIGIN: https://crm.hotelexpert.mx
      COOKIE_SECURE: "true"
      N8N_WHATSAPP_WEBHOOK_URL: ${N8N_WHATSAPP_WEBHOOK_URL:-}
      WHATSAPP_RELAY_SECRET: ${WHATSAPP_RELAY_SECRET:-}
      META_WHATSAPP_VERIFY_TOKEN: ${META_WHATSAPP_VERIFY_TOKEN:-}
      META_WHATSAPP_APP_SECRET: ${META_WHATSAPP_APP_SECRET:-}
    volumes:
      - ${CRM_DATA_DIRECTORY:?Configure CRM_DATA_DIRECTORY}:/app/.local
    networks:
      - backend
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  nginx:
    image: ${NGINX_IMAGE:-nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94}
    restart: unless-stopped
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101,mode=1770
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      crm:
        condition: service_healthy
    networks:
      - proxy
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      traefik.enable: "true"
      traefik.docker.network: n8n-proxy
      traefik.http.routers.she-crm.rule: Host(`crm.hotelexpert.mx`)
      traefik.http.routers.she-crm.entrypoints: websecure
      traefik.http.routers.she-crm.tls.certresolver: le
      traefik.http.routers.she-crm.middlewares: she-crm-gateway
      traefik.http.routers.she-crm.service: she-crm
      # WhatsApp authenticates requests with its existing token/HMAC checks.
      traefik.http.routers.she-crm-webhooks.rule: Host(`crm.hotelexpert.mx`) && (Path(`/api/whatsapp-relay`) || Path(`/api/meta-whatsapp-webhook`))
      traefik.http.routers.she-crm-webhooks.entrypoints: websecure
      traefik.http.routers.she-crm-webhooks.tls.certresolver: le
      traefik.http.routers.she-crm-webhooks.service: she-crm
      traefik.http.services.she-crm.loadbalancer.server.port: "8080"
      traefik.http.middlewares.she-crm-gateway.headers.customrequestheaders.X-SHE-Proxy-Secret: ${SARA_PROXY_SECRET:?Configure SARA_PROXY_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  backend:
    driver: bridge
  proxy:
    external: true
    name: n8n-proxy
